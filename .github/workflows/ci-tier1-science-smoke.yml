name: ci-tier1-science-smoke

on:
  pull_request:
    paths:
      - 'src/xstar_tools/xstar/**'
      - 'src/xstar_tools/execution.py'
      - 'src/xstar_tools/config.py'
      - 'src/xstar_tools/backends.py'
      - 'src/xstar_tools/result.py'
      - 'src/xstar_tools/benchmarks/**'
      - 'qualification/current/**'
  push:
    branches: [main, master]
    paths:
      - 'src/xstar_tools/xstar/**'
      - 'src/xstar_tools/execution.py'
      - 'src/xstar_tools/config.py'
      - 'src/xstar_tools/backends.py'
      - 'src/xstar_tools/result.py'
      - 'src/xstar_tools/benchmarks/**'
      - 'qualification/current/**'
  workflow_dispatch:
    inputs:
      include_c5:
        description: 'Opt in to the frozen C5 smoke case; disabled by default'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  selected-science-smoke:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, xstar-science]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical science assets
        id: assets
        run: python tools/ci/require_science_assets.py --github-output "$GITHUB_OUTPUT"
      - name: Install source package
        env:
          XSTAR_TOOLS_NATIVE: required
        run: python -m pip install -e .
      - name: Build native backends
        run: make -C src/xstar_tools/xstar/cpp -j2
      - name: Run O/Mg/Ca Python-controller smoke
        run: |
          python -m xstar_tools.cli.main qualify benchmark run \
            --package "$GITHUB_WORKSPACE" \
            --data '${{ steps.assets.outputs.data }}' \
            --suite-archive '${{ steps.assets.outputs.suite }}' \
            --out tier1-smoke \
            --no-full-modes \
            --python-mode pure-python \
            --python-mode zone-python \
            --python-case helike_type69/o7_ne1e10 \
            --python-case helike_type69/mg11_ne1e8 \
            --python-case helike_type69/ca19_xi2_ne1 \
            --jobs 1
      - name: Optional frozen C5 diagnostic smoke
        if: github.event_name == 'workflow_dispatch' && inputs.include_c5
        run: |
          python -m xstar_tools.cli.main qualify benchmark run \
            --package "$GITHUB_WORKSPACE" \
            --data '${{ steps.assets.outputs.data }}' \
            --suite-archive '${{ steps.assets.outputs.suite }}' \
            --out tier1-c5-opt-in \
            --no-full-modes \
            --python-mode zone-python \
            --python-case helike_type69/c5_ne1 \
            --jobs 1
      - name: Compare selected smoke with canonical Fortran
        run: |
          python -m xstar_tools.cli.main qualify benchmark compare \
            --package "$GITHUB_WORKSPACE" \
            --run-root tier1-smoke \
            --fortran-reference-archive '${{ steps.assets.outputs.fortran }}' \
            --out tier1-smoke/comparisons
      - name: Enforce material science, publication diagnostics, provenance, and STEP
        run: |
          python tools/ci/check_science_results.py \
            --run-root tier1-smoke \
            --comparison-root tier1-smoke/comparisons \
            --require-mode pure-python \
            --require-mode zone-python \
            --require-case helike_type69/o7_ne1e10 \
            --require-case helike_type69/mg11_ne1e8 \
            --require-case helike_type69/ca19_xi2_ne1
      - name: Upload Tier-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-science-smoke
          path: |
            tier1-smoke/run_manifest.csv
            tier1-smoke/run_summary.json
            tier1-smoke/comparisons/
            tier1-smoke/logs/
