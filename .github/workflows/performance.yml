name: performance-ci

on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-hardware-performance:
    runs-on: [self-hosted, linux, x64, xstar-perf]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical science assets
        id: assets
        run: python tools/ci/require_science_assets.py --github-output "$GITHUB_OUTPUT"
      - name: Install source package
        env:
          XSTAR_TOOLS_NATIVE: required
        run: python -m pip install -e .
      - name: Run performance fixtures independently of science gates
        run: |
          python -m xstar_tools.cli.main qualify benchmark run \
            --package "$GITHUB_WORKSPACE" \
            --data '${{ steps.assets.outputs.data }}' \
            --suite-archive '${{ steps.assets.outputs.suite }}' \
            --out performance-run \
            --no-python-modes \
            --full-mode zone-cpp \
            --full-mode xstar-cpp \
            --case helike_type69/o7_ne1 \
            --case helike_type69/mg11_ne1e8 \
            --case helike_type69/ca19_xi2_ne1 \
            --build-cpp \
            --jobs 1
      - name: Produce report-only performance series
        run: |
          python tools/ci/performance_report.py \
            --run-manifest performance-run/run_manifest.csv \
            --out performance-run/performance_report.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-controlled-hardware
          path: |
            performance-run/run_manifest.csv
            performance-run/performance_report.json
            performance-run/logs/
