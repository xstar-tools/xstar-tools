name: Linux ARM64 packaging 0.6.91.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-wheels:
    name: Native ARM64 manylinux wheel qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install qualification test dependency
        run: python -m pip install "pytest>=7"

      - name: Verify frozen science and packaging contract
        run: |
          python -B tools/qualification/run_linux_arm64_packaging_host_0_6_91_3.py \
            --package "$PWD" --preflight-only
          python -B -m pytest -q tests/test_linux_arm64_packaging_0_6_91_3.py

      - name: Build, auditwheel repair and isolated smoke-test ARM64 wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: >-
            cp311-manylinux_aarch64
            cp313-manylinux_aarch64
          CIBW_ARCHS_LINUX: aarch64
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Inspect repaired ARM64 wheel artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "twine>=6,<7"
          python -m twine check wheelhouse/*.whl
          python -B tools/qualification/run_linux_arm64_packaging_host_0_6_91_3.py \
            --package "$PWD" \
            --wheel-dir "$PWD/wheelhouse" \
            --output-root "$RUNNER_TEMP/linux_arm64_packaging_06913_evidence" \
            --require-builds cp311 cp313

      - name: Upload repaired wheels (including partial sets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packaging-06913-wheels
          path: wheelhouse/*.whl
          if-no-files-found: warn

      - name: Upload packaging qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packaging-06913-evidence
          path: ${{ runner.temp }}/linux_arm64_packaging_06913_evidence/
          if-no-files-found: warn
