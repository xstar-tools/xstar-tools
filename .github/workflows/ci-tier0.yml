name: ci-tier0

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject committed generated artifacts
        run: python tools/ci/check_tree_clean.py

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and lint tooling
        run: |
          python -m pip install -e .
          python -m pip install 'ruff>=0.12,<0.15'
      - name: Python syntax, import, and public API type contract
        run: python tools/ci/check_python_contract.py
      - name: Lint for fatal Python defects
        run: >-
          ruff check --select E9,F63,F7,F82
          src/xstar_tools/config.py
          src/xstar_tools/data.py
          src/xstar_tools/result.py
          src/xstar_tools/backends.py
          src/xstar_tools/execution.py
          src/xstar_tools/benchmarks/public_suite.py
          tools/ci
      - name: Repository text format policy
        run: python tools/ci/check_text_policy.py

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run active unit/qualification tests
        run: python -m pytest -q

  cpp-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native compile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcfitsio-dev pkg-config g++ make
      - name: Compile complete active C++ tree
        env:
          XSTAR_TOOLS_NATIVE_JOBS: '2'
        run: |
          make -C src/xstar_tools/xstar/cpp clean
          make -C src/xstar_tools/xstar/cpp -j2
      - name: Clean native build outputs
        if: always()
        run: make -C src/xstar_tools/xstar/cpp clean || true

  metadata-abi-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package metadata and ABI/header contract
        run: python tools/ci/check_package_metadata.py
      - name: Parity-freeze manifest integrity
        run: python tools/qualification/check_parity_freeze.py
      - name: Public C ABI and xstar-cpp contract
        run: python tools/qualification/check_xstar_cpp_first_class.py
