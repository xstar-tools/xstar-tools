name: ci-tier2-backend-parity

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-backend-parity:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'science-affecting'))
    runs-on: [self-hosted, linux, x64, xstar-science]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical science and frozen C++ assets
        id: assets
        run: python tools/ci/require_science_assets.py --need-cpp44 --github-output "$GITHUB_OUTPUT"
      - name: Install source package
        env:
          XSTAR_TOOLS_NATIVE: required
        run: python -m pip install -e .
      - name: Run selected fixtures across all five public modes
        run: |
          python -m xstar_tools.cli.main qualify benchmark run \
            --package "$GITHUB_WORKSPACE" \
            --data '${{ steps.assets.outputs.data }}' \
            --suite-archive '${{ steps.assets.outputs.suite }}' \
            --out tier2-parity \
            --case helike_type69/o7_ne1e10 \
            --case helike_type69/mg11_ne1e8 \
            --case helike_type69/ca19_xi2_ne1 \
            --python-case helike_type69/o7_ne1e10 \
            --python-case helike_type69/mg11_ne1e8 \
            --python-case helike_type69/ca19_xi2_ne1 \
            --build-cpp \
            --jobs 1
      - name: Compare with Fortran, frozen C++44, and current backends
        run: |
          python -m xstar_tools.cli.main qualify benchmark compare \
            --package "$GITHUB_WORKSPACE" \
            --run-root tier2-parity \
            --fortran-reference-archive '${{ steps.assets.outputs.fortran }}' \
            --cpp-reference-archive '${{ steps.assets.outputs.cpp44 }}' \
            --out tier2-parity/comparisons
      - name: Enforce selected backend parity
        run: |
          python tools/ci/check_science_results.py \
            --run-root tier2-parity \
            --comparison-root tier2-parity/comparisons \
            --require-mode pure-python \
            --require-mode zone-python \
            --require-mode zone-cpp \
            --require-mode zone-all \
            --require-mode xstar-cpp \
            --require-case helike_type69/o7_ne1e10 \
            --require-case helike_type69/mg11_ne1e8 \
            --require-case helike_type69/ca19_xi2_ne1 \
            --require-cpp44-exact \
            --require-current-backend-science
      - name: Upload Tier-2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-backend-parity
          path: |
            tier2-parity/run_manifest.csv
            tier2-parity/run_summary.json
            tier2-parity/comparisons/
            tier2-parity/logs/
