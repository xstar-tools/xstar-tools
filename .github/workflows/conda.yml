name: conda-package

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  recipe-and-linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: conda-build-env
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          conda-build-version: latest
      - name: Install source-build tooling
        run: python -m pip install build
      - name: Build the exact source distribution used by the recipe
        env:
          XSTAR_TOOLS_NATIVE: off
        run: python -m build --sdist
      - name: Prepare local-source copy of the forge recipe
        run: |
          SDIST=$(ls dist/xstar_tools-*.tar.gz)
          python tools/packaging/prepare_local_conda_recipe.py \
            --recipe conda/recipe \
            --sdist "$SDIST" \
            --out _conda_recipe
      - name: Render recipe
        run: conda render _conda_recipe --override-channels -c conda-forge
      - name: Build and test conda package
        run: conda build _conda_recipe --override-channels -c conda-forge

  recipe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free conda packaging gate
        run: python tools/qualification/check_conda_packaging.py
      - name: Run offline scientific smoke directly from source
        env:
          PYTHONPATH: src
        run: python conda/recipe/tests/offline_science_smoke.py
