name: parity-freeze

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  parity-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate scientific parity freeze
        run: python tools/qualification/check_parity_freeze.py
      - name: Validate unified CLI contract
        run: python tools/qualification/check_unified_cli.py
      - name: Validate first-class xstar-cpp
        run: python tools/qualification/check_xstar_cpp_first_class.py
      - name: Validate Milestone-7 documentation contract
        run: python tools/qualification/check_documentation_milestone.py
      - name: Validate Milestone-8 packaging contract
        run: python tools/qualification/check_packaging_milestone.py
      - name: Validate source concordance
        run: python tools/qualification/check_source_concordance.py
      - name: Validate C++ source correspondence comments
        run: python tools/qualification/check_cpp_source_comments.py
      - name: Validate Python source correspondence comments
        run: python tools/qualification/check_python_source_comments.py
      - name: Validate C++ non-science native-layout refactor
        run: python tools/qualification/check_cpp_non_science_refactor.py
      - name: Test parity-freeze and source-concordance contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_parity_freeze_boundary.py tests/test_option15_material_surface.py tests/test_source_concordance_gate.py tests/test_cpp_source_comments.py tests/test_python_source_comments.py tests/test_0654_native_layout_cleanup.py tests/test_unified_cli_0_6_68.py tests/test_xstar_cpp_first_class_0_6_69.py tests/test_documentation_milestone_0_6_70.py tests/test_packaging_milestone_0_6_71.py tests/test_conda_packaging_0_6_72.py tests/test_source_function_comments_0_6_73.py
