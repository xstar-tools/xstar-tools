name: packaging

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    env:
      XSTAR_TOOLS_NATIVE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install source-build tooling
        run: python -m pip install build twine
      - name: Build source distribution only
        run: python -m build --sdist
      - name: Validate source distribution metadata
        run: python -m twine check dist/*.tar.gz
      - name: Upload exact sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  python-wheel:
    runs-on: ubuntu-latest
    env:
      XSTAR_TOOLS_NATIVE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install wheel-build tooling
        run: python -m pip install build twine
      - name: Build Python-only wheel
        run: python -m build --wheel
      - name: Validate wheel metadata
        run: python -m twine check dist/*.whl
      - name: Upload Python-only wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

  clean-wheel-install:
    needs: python-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel without source checkout
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install dist/*.whl
          wheel-env/bin/xstar-tools version
          wheel-env/bin/xstar-tools doctor --require pure-python

  editable-install:
    runs-on: ubuntu-latest
    env:
      XSTAR_TOOLS_NATIVE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Editable install contract
        run: |
          python -m pip install -e .
          xstar-tools version
          xstar-tools doctor --require pure-python
          python tools/ci/check_python_contract.py

  linux-native-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      XSTAR_TOOLS_NATIVE: required
      XSTAR_TOOLS_NATIVE_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native and release prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcfitsio-dev pkg-config g++ make
          python -m pip install build twine
      - name: Build native wheel
        run: python -m build --wheel
      - name: Validate native wheel metadata
        run: python -m twine check dist/*.whl
      - name: Clean-install and exercise native wheel
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install dist/*.whl
          wheel-env/bin/xstar-tools doctor --require zone-cpp
          wheel-env/bin/xstar-cpp --abi
      - name: Upload native wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ matrix.arch }}
          path: dist/*.whl

  python-only-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      XSTAR_TOOLS_NATIVE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install release tooling
        run: python -m pip install build twine
      - name: Build Python-only wheel
        run: python -m build --wheel
      - name: Validate wheel
        run: python -m twine check dist/*.whl
      - name: Install and check Python-only capability
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          xstar-tools version
          xstar-tools doctor --require pure-python
