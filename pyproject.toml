[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xstar-tools"
version = "0.6.90.5.5"
description = "Python/C++ tools for XSTAR atomic data and high-performance runtimes"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Ashkbiz Danehkar"}
]
keywords = ["astronomy", "atomic-data", "xstar", "fits", "emissivity", "x-ray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.23,<2.4; python_version < '3.11'",
  "astropy>=5.0; python_version < '3.11'",
  "numpy>=1.24; python_version >= '3.11'",
  "astropy>=7.2; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5"]
docs = ["sphinx==8.2.3", "sphinx-rtd-theme==3.1.0", "myst-parser==5.1.0"]
hdf5 = ["h5py>=3"]
sparse = ["scipy>=1.8"]

[project.scripts]

xstar-tools = "xstar_tools.cli.main:main"
xstar-cpp = "xstar_tools.cli.xstar_cpp:main"
xstar-xspec-initable = "xstar_tools.cli.native_exec:main_xstar_xspec_initable"
xstar-xspec-table = "xstar_tools.cli.native_exec:main_xstar_xspec_table"
xstar-xspec = "xstar_tools.cli.native_exec:main_xstar_xspec"
xstar-tools-benchmark = "xstar_tools.benchmarks.public_suite:main"
xstar-tools-run-xstar = "xstar_tools.cli.run_xstar:main"
xstar-tools-inspect-atdb = "xstar_tools.cli.inspect_atdb:main"
xstar-tools-xstinitable = "xstar_tools.cli.xstinitable:main"
xstar-tools-xstar2table = "xstar_tools.cli.xstar2table:main"
xstar-tools-xstar2xspec = "xstar_tools.cli.xstar2xspec:main"
xstar-tools-mpixstar = "xstar_tools.cli.mpixstar:main"


xstar-tools-inspect = "xstar_tools.inspect:main"
xstar-tools-hierarchy = "xstar_tools.hierarchy:main"
xstar-tools-lines = "xstar_tools.lines:main"
xstar-tools-photoionization = "xstar_tools.photoionization:main"
xstar-tools-collisions = "xstar_tools.collisions:main"
xstar-tools-recombination = "xstar_tools.recombination:main"
xstar-tools-emissivity = "xstar_tools.emissivity:main"
xstar-tools-solver = "xstar_tools.solver:main"
xstar-tools-validate-collisions = "xstar_tools.validation:main"
xstar-tools-export = "xstar_tools.export:main"
xstar-tools-export-superwind = "xstar_tools.export:main"
xstar-tools-xstar-outputs = "xstar_tools.xstar_outputs:main"
xstar-tools-download-data = "xstar_tools.data:main"
xstar-tools-plan-xstar-run = "xstar_tools.xstar_run:main"
xstar-tools-run-python = "xstar_tools.source_port_physical_runner_cli:main"
xstar-tools-original-parity-gate = "xstar_tools.xstar.original_parity_gate:main"
xstar-tools-cpp-parity-gate = "xstar_tools.xstar.cpp_parity_gate:main"
xstar-tools-qualification = "xstar_tools.xstar.qualification:main"
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"xstar_tools.benchmarks" = [
  "v06486_qualification_reference_v0472/reference_radiation_v0472_full.csv",
  "v06486_qualification_reference_v0472/trajectory.csv",
  "v0648724_call1_thermal_leaf_reference/*",
]
"xstar_tools.xstar" = ["data/coheat.dat", "cpp/constants.def", "cpp/xstar_api.h", "cpp/xstar_production_zone_bridge.h", "cpp/xstar_xspec_table.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["historical"]

# version = "0.6.89.1.1"

[tool.cibuildwheel]
build = "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
skip = "cp3??t-*"
build-verbosity = 1
test-command = "python {package}/tools/packaging/pypi_release_linux_smoke.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
  "dnf install -y zlib-devel pkgconf-pkg-config",
  "bash {package}/tools/packaging/build_manylinux_cfitsio.sh",
]
environment = { XSTAR_TOOLS_NATIVE="required", XSTAR_TOOLS_NATIVE_PROFILE="pypi-linux", XSTAR_TOOLS_NATIVE_JOBS="2", XSTAR_TOOLS_CFITSIO_PREFIX="/opt/xstar-cfitsio", PKG_CONFIG_PATH="/opt/xstar-cfitsio/lib/pkgconfig:/opt/xstar-cfitsio/lib64/pkgconfig", LD_LIBRARY_PATH="/opt/xstar-cfitsio/lib:/opt/xstar-cfitsio/lib64" }
repair-wheel-command = "auditwheel repair --wheel-dir {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = "bash {package}/tools/packaging/build_macos_cfitsio.sh"
environment = { XSTAR_TOOLS_NATIVE="required", XSTAR_TOOLS_NATIVE_PROFILE="pypi-macos", XSTAR_TOOLS_NATIVE_JOBS="2", XSTAR_TOOLS_CFITSIO_PREFIX="/tmp/xstar-cfitsio", XSTAR_TOOLS_CFITSIO_JOBS="2", PKG_CONFIG_PATH="/tmp/xstar-cfitsio/lib/pkgconfig", REPAIR_LIBRARY_PATH="/tmp/xstar-cfitsio/lib", MACOSX_DEPLOYMENT_TARGET="11.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$REPAIR_LIBRARY_PATH delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
test-command = "python {package}/tools/packaging/pypi_release_macos_smoke.py"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { XSTAR_TOOLS_NATIVE="required", XSTAR_TOOLS_NATIVE_PROFILE="pypi-windows", XSTAR_TOOLS_NATIVE_JOBS="2" }
repair-wheel-command = "delvewheel repair --ignore-existing --analyze-existing --analyze-existing-exes --add-path %XSTAR_TOOLS_WINDOWS_DLL_PATH% -w {dest_dir} -v {wheel}"
test-command = "python {package}/tools/packaging/pypi_release_windows_smoke.py"
