[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xstar-atomic"
version = "0.4.51"
description = "Source-faithful Python port and atomic-physics audit tools for XSTAR"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Ashkbiz Danehkar"}
]
keywords = ["astronomy", "atomic-data", "xstar", "fits", "emissivity", "x-ray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.23",
  "astropy>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]
hdf5 = ["h5py>=3"]
sparse = ["scipy>=1.8"]

[project.scripts]
xstar-atomic-inspect = "xstar_atomic.inspect:main"
xstar-atomic-hierarchy = "xstar_atomic.hierarchy:main"
xstar-atomic-lines = "xstar_atomic.lines:main"
xstar-atomic-photoionization = "xstar_atomic.photoionization:main"
xstar-atomic-collisions = "xstar_atomic.collisions:main"
xstar-atomic-recombination = "xstar_atomic.recombination:main"
xstar-atomic-emissivity = "xstar_atomic.emissivity:main"
xstar-atomic-solver = "xstar_atomic.solver:main"
xstar-atomic-validate-collisions = "xstar_atomic.validation:main"
xstar-atomic-export = "xstar_atomic.export:main"
xstar-atomic-export-superwind = "xstar_atomic.export:main"
xstar-atomic-xstar-outputs = "xstar_atomic.xstar_outputs:main"
xstar-atomic-download-data = "xstar_atomic.data:main"
xstar-atomic-plan-xstar-run = "xstar_atomic.xstar_run:main"
xstar-atomic-source-inventory = "xstar_atomic.source_port_cli:main"
xstar-atomic-port-atdb = "xstar_atomic.source_port_atomic_db_cli:main"
xstar-atomic-port-ucalc = "xstar_atomic.source_port_ucalc_cli:main"
xstar-atomic-port-element = "xstar_atomic.source_port_element_cli:main"
xstar-atomic-port-escape = "xstar_atomic.source_port_escape_cli:main"
xstar-atomic-port-local-zone = "xstar_atomic.source_port_local_zone_cli:main"
xstar-atomic-port-all-elements = "xstar_atomic.source_port_all_element_cli:main"
xstar-atomic-port-compton = "xstar_atomic.source_port_compton_cli:main"
xstar-atomic-port-freef = "xstar_atomic.source_port_free_free_cli:main"
xstar-atomic-port-bremem = "xstar_atomic.source_port_bremem_cli:main"
xstar-atomic-port-heatf = "xstar_atomic.source_port_heatf_cli:main"
xstar-atomic-port-complete-fixed-state = "xstar_atomic.source_port_complete_fixed_state_cli:main"
xstar-atomic-port-dsec = "xstar_atomic.source_port_dsec_cli:main"
xstar-atomic-validate-dsec-physical = "xstar_atomic.source_port_dsec_physical_cli:main"
xstar-atomic-validate-dsec-transition = "xstar_atomic.source_port_dsec_physical_cli:main"
xstar-atomic-prepare-calc-hmc-all-probe = "xstar_atomic.calc_hmc_all_probe_cli:main"
xstar-atomic-prepare-dsec-probe = "xstar_atomic.dsec_probe_cli:main"
xstar-atomic-prepare-dsec-matching-probe = "xstar_atomic.dsec_matching_probe_cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"xstar_atomic.benchmarks" = ["oxygen_milestone3_v0422/*", "oxygen_v0434_correction_targets/*", "oxygen_call73_v0434_acceptance/*", "hydrogen_v0436_targets/*", "all_element_call73_v0438_acceptance/*", "comp2_call73_v0439_acceptance/*", "freef_call73_v0440_acceptance/*", "bremem_call73_v0441_acceptance/*", "heatf_call73_v0442_acceptance/*", "complete_fixed_state_v0443_state_ownership/*", "complete_fixed_state_v0444_acceptance/*"]
"xstar_atomic.source_port" = ["data/coheat.dat"]
