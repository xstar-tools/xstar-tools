[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xstar-atomic"
version = "0.3.9"
description = "Direct reader, rate evaluator, emissivity tools, and prototype solvers for XSTAR atomic data in atdb.fits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Ashkbiz Danehkar"}
]
keywords = ["astronomy", "atomic-data", "xstar", "fits", "emissivity", "x-ray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.23",
  "astropy>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]
hdf5 = ["h5py>=3"]
sparse = ["scipy>=1.8"]

[project.scripts]
xstar-atomic-inspect = "xstar_atomic.inspect:main"
xstar-atomic-hierarchy = "xstar_atomic.hierarchy:main"
xstar-atomic-lines = "xstar_atomic.lines:main"
xstar-atomic-photoionization = "xstar_atomic.photoionization:main"
xstar-atomic-collisions = "xstar_atomic.collisions:main"
xstar-atomic-recombination = "xstar_atomic.recombination:main"
xstar-atomic-emissivity = "xstar_atomic.emissivity:main"
xstar-atomic-solver = "xstar_atomic.solver:main"
xstar-atomic-validate-collisions = "xstar_atomic.validation:main"
xstar-atomic-export = "xstar_atomic.export:main"
xstar-atomic-export-superwind = "xstar_atomic.export:main"
xstar-atomic-xstar-outputs = "xstar_atomic.xstar_outputs:main"
xstar-atomic-download-data = "xstar_atomic.data:main"

[tool.setuptools.packages.find]
where = ["src"]

