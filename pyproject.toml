[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.23"]
build-backend = "setuptools.build_meta"

[project]
name = "xstar-tools"
version = "0.6.12"
description = "Source-faithful Python/C++ XSTAR tools, atomic-data utilities, benchmarks, and runtime"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Ashkbiz Danehkar"}
]
keywords = ["astronomy", "atomic-data", "xstar", "fits", "emissivity", "x-ray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.23,<2.4; python_version < '3.11'",
  "astropy>=5.0; python_version < '3.11'",
  "numpy>=1.24; python_version >= '3.11'",
  "astropy>=7.2; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]
hdf5 = ["h5py>=3"]
sparse = ["scipy>=1.8"]

[project.scripts]

xstar-tools-run-xstar = "xstar_tools.cli.run_xstar:main"
xstar-tools-inspect-atdb = "xstar_tools.cli.inspect_atdb:main"
xstar-tools-xstinitable = "xstar_tools.cli.xstinitable:main"
xstar-tools-xstar2table = "xstar_tools.cli.xstar2table:main"
xstar-tools-xstar2xspec = "xstar_tools.cli.xstar2xspec:main"
xstar-tools-mpixstar = "xstar_tools.cli.mpixstar:main"


