[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xstar-atdb"
version = "0.1.0"
description = "Direct reader and prototype physics evaluators for XSTAR's packed atdb.fits atomic database"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Ashkbiz Danehkar / ChatGPT-assisted development"}
]
keywords = ["astronomy", "atomic-data", "xstar", "fits", "emissivity", "x-ray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.23",
  "astropy>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xstar-atdb-inspect = "xstar_atdb.inspect:main"
xstar-atdb-hierarchy = "xstar_atdb.hierarchy:main"
xstar-atdb-lines = "xstar_atdb.lines:main"
xstar-atdb-photoionization = "xstar_atdb.photoionization:main"
xstar-atdb-collisions = "xstar_atdb.collisions:main"
xstar-atdb-recombination = "xstar_atdb.recombination:main"
xstar-atdb-emissivity = "xstar_atdb.emissivity:main"
xstar-atdb-solver = "xstar_atdb.solver:main"

[tool.setuptools.packages.find]
where = ["src"]
